<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TOOLS</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --ink:#111111;
    --yellow:#FFE347;
    --red:#FF4B3E;
    --blue:#3F6FFF;
    --text-dim:#6B6B6B;
    --font-mono:"JetBrains Mono", monospace;
    --font-jp:"Zen Kaku Gothic New", sans-serif;
    --bw:3px;
    --sh:6px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-jp);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
  }
  a{text-decoration:none;color:inherit;}

  .wrap{width:100%;max-width:560px;}

  .title-tag{
    display:inline-block;
    font-family:var(--font-mono);
    font-weight:800;
    font-size:clamp(22px,6.5vw,32px);
    letter-spacing:.02em;
    color:var(--ink);
    background:var(--yellow);
    border:var(--bw) solid var(--ink);
    box-shadow:var(--sh) var(--sh) 0 var(--ink);
    padding:14px 22px;
    margin:0 0 8px;
    text-transform:uppercase;
  }
  .sub{
    font-size:12px;
    letter-spacing:.1em;
    color:var(--text-dim);
    font-family:var(--font-mono);
    font-weight:700;
    margin:0 0 36px;
  }

  .tool-list{
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .tool-card{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    border:var(--bw) solid var(--ink);
    background:var(--bg);
    box-shadow:var(--sh) var(--sh) 0 var(--ink);
    padding:20px 22px;
    transition:transform .08s, box-shadow .08s;
  }
  .tool-card:hover{transform:translate(-2px,-2px);box-shadow:calc(var(--sh) + 2px) calc(var(--sh) + 2px) 0 var(--ink);}
  .tool-card:active{transform:translate(var(--sh),var(--sh));box-shadow:0 0 0 var(--ink);}

  .tool-name{
    font-family:var(--font-jp);
    font-weight:900;
    font-size:18px;
    letter-spacing:.01em;
    margin:0 0 4px;
  }
  .tool-desc{
    font-size:12px;
    color:var(--text-dim);
    font-weight:500;
    margin:0;
  }
  .tool-arrow{
    font-family:var(--font-mono);
    font-weight:800;
    font-size:22px;
    flex-shrink:0;
  }

  .tool-card.timer .tool-arrow{color:var(--red);}

  .foot{
    margin-top:32px;
    font-size:11px;
    color:var(--text-dim);
    font-family:var(--font-mono);
    letter-spacing:.05em;
    text-align:center;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="title-tag">TOOLS</div>
  <p class="sub">SMALL SINGLE-PURPOSE APPS</p>

  <div class="tool-list">
    <a class="tool-card timer" href="./time-boxed-writing.html">
      <div>
        <p class="tool-name">TIME-BOXED WRITING</p>
        <p class="tool-desc">制限時間を決めて、書ききる。カウントダウン付きエディタ</p>
      </div>
      <span class="tool-arrow">→</span>
    </a>
  </div>

  <p class="foot">GITHUB PAGES</p>
</div>
</body>
</html>

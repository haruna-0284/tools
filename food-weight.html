<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>体重・食事記録</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#222;font:15px/1.5 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:560px;margin:0 auto;padding:12px 14px 60px}
h2{font-size:15px;margin:22px 0 8px}
input,select,button{font:inherit;font-size:16px;padding:9px 10px;border:1px solid #d8dce0;border-radius:8px;background:#fff;color:inherit;width:100%}
button{width:auto;cursor:pointer}
button.p{background:#2563eb;border-color:#2563eb;color:#fff}
button.g{border-color:transparent;color:#2563eb;padding:4px 8px;font-size:13px}
.row{display:flex;gap:8px;margin-bottom:8px}.row>*{flex:1;min-width:0}
label{display:block;font-size:12px;color:#666;margin-bottom:2px}
.tabs{display:flex;border-bottom:1px solid #e5e7eb;position:sticky;top:0;background:#fff;z-index:2}
.tabs button{flex:1;border:0;border-bottom:2px solid transparent;border-radius:0;padding:12px 0}
.tabs button.on{border-color:#2563eb;color:#2563eb;font-weight:600}
.sg{position:relative}.sg div.l{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid #d8dce0;border-radius:8px;z-index:5;box-shadow:0 4px 12px #0001;max-height:260px;overflow:auto}
.sg div.l div{padding:9px 10px;border-bottom:1px solid #f0f0f0}.sg small{color:#666;margin-left:6px}
.tot{border:1px solid #e5e7eb;border-radius:8px;padding:10px 12px;margin:10px 0}.tot span{display:inline-block;margin-right:12px}.tot small,.mut{color:#777;font-size:12px}
.it{padding:10px 0;border-bottom:1px solid #eee}.it b{font-weight:600}
.nav{display:flex;gap:6px;align-items:center}.nav input{text-align:center}
.pv{font-size:13px;color:#2563eb;min-height:20px}
.rg button{padding:6px 12px;font-size:13px}.rg button.on{background:#eff4ff;border-color:#2563eb;color:#2563eb}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<section id="login" hidden>
  <h2 style="font-size:18px;margin-top:40px">ログイン</h2>
  <form id="lf"><div class="row"><input id="em" type="email" placeholder="メールアドレス" autocomplete="username" required></div>
  <div class="row"><input id="pw" type="password" placeholder="パスワード" autocomplete="current-password" required></div>
  <button class="p" style="width:100%">ログイン</button><p id="le" style="color:#c00"></p></form>
</section>

<div id="app" hidden>
<div class="tabs"><button data-t="meal" class="on">食事</button><button data-t="weight">体重</button><button data-t="set">設定</button></div>

<section id="t-meal">
  <h2 id="ft">食事を記録</h2>
  <form id="mf">
    <div class="row"><div><label>日付</label><input id="d" type="date" required></div><div><label>時刻</label><input id="t" type="time" required></div></div>
    <div class="row"><div><label>場所</label><select id="pl"><option>自宅</option><option>職場</option><option>実家</option><option value="他">その他（入力）</option></select></div>
      <div><label>区分</label><select id="cat"><option>朝食</option><option>昼食</option><option>夕食</option><option>間食</option></select></div></div>
    <div class="row" id="pfw" hidden><input id="pf" list="pls" placeholder="店名など"><datalist id="pls"></datalist></div>
    <div class="sg row" style="display:block"><label>料理名</label><input id="nm" autocomplete="off" required><div class="l" id="sg" hidden></div></div>
    <div class="row"><div><label>カロリー(kcal)</label><input id="kc" type="number" step="0.1" min="0" inputmode="decimal"></div><div><label>たんぱく質(g)</label><input id="pp" type="number" step="0.1" min="0" inputmode="decimal"></div></div>
    <div class="row"><div><label>脂質(g)</label><input id="ff" type="number" step="0.1" min="0" inputmode="decimal"></div><div><label>炭水化物(g)</label><input id="cc" type="number" step="0.1" min="0" inputmode="decimal"></div></div>
    <div class="row"><div><label>補正（×）</label><input id="fc" type="number" step="0.01" min="0.01" value="1" inputmode="decimal"></div><div class="pv" id="pv" style="align-self:end"></div></div>
    <div class="row"><button class="p" id="sv">記録する</button><button type="button" id="cn" hidden>編集をやめる</button></div>
  </form>

  <h2>記録一覧</h2>
  <div class="nav"><button id="pd">‹</button><input id="vd" type="date"><button id="nd">›</button></div>
  <div class="tot" id="tot"></div>
  <div id="ls"></div>
</section>

<section id="t-weight" hidden>
  <h2>体重を記録</h2>
  <form id="wf"><div class="row"><div><label>日付</label><input id="wd" type="date" required></div><div><label>体重(kg)</label><input id="wk" type="number" step="0.1" min="20" max="300" inputmode="decimal" required></div></div>
  <button class="p">記録する</button> <span class="mut">同じ日は上書きされます</span></form>
  <h2>推移</h2>
  <div class="rg row" id="rg"><button data-r="7">1週間</button><button data-r="30" class="on">1か月</button><button data-r="90">3か月</button><button data-r="0">全期間</button></div>
  <div style="position:relative;height:300px"><canvas id="ch"></canvas></div>
</section>

<section id="t-set" hidden>
  <h2>目標体重</h2>
  <div class="row"><input id="tg" type="number" step="0.1" placeholder="kg（空欄で解除）" inputmode="decimal"><button class="p" id="tgs" style="flex:0 0 auto">保存</button></div>
  <h2>mdで出力</h2>
  <div class="row"><input id="mo" type="month"><button class="p" id="ex" style="flex:0 0 auto">出力</button></div>
  <p class="mut">補正後の値で、月単位のファイルをダウンロードします。</p>
  <h2>アカウント</h2><button id="lo">ログアウト</button>
</section>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const SB_URL='https://tbaarvevvctisyxyabvq.supabase.co', SB_KEY='sb_publishable_kW49T7YATKqFMFmDIJua-w_wb8B9wQ0';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const HOME=['自宅','職場','実家'], r1=x=>Math.round(x*10)/10;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const nowT=()=>new Date().toTimeString().slice(0,5);
let meals=[],weights=[],target=null,uid=null,chart,range=30,editId=null,catManual=false,viewDate=today();

// ---- 認証 ----
sb.auth.onAuthStateChange((_,s)=>{
  $('#login').hidden=!!s;$('#app').hidden=!s;
  if(s&&uid!==s.user.id){uid=s.user.id;load()}
  if(!s)uid=null;
});
$('#lf').onsubmit=async e=>{e.preventDefault();
  const{error}=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});
  $('#le').textContent=error?'ログインできませんでした。メールとパスワードを確認してください。':''};
$('#lo').onclick=()=>sb.auth.signOut();

// ---- データ読み込み ----
async function load(){
  const[m,w,s]=await Promise.all([
    sb.from('meals').select('*').order('eaten_date',{ascending:false}).order('eaten_time',{ascending:false}).limit(5000),
    sb.from('weights').select('*').order('date'),
    sb.from('settings').select('*').maybeSingle()]);
  meals=(m.data||[]).map(x=>({...x,eaten_time:x.eaten_time.slice(0,5)}));
  weights=w.data||[];target=s.data?.target_kg??null;$('#tg').value=target??'';
  $('#pls').innerHTML=[...new Set(meals.map(x=>x.place).filter(p=>!HOME.includes(p)))].map(p=>`<option value="${esc(p)}">`).join('');
  renderDay();renderChart();
}

// ---- タブ ----
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  ['meal','weight','set'].forEach(k=>$('#t-'+k).hidden=k!==b.dataset.t);
  if(b.dataset.t==='weight')renderChart();
});

// ---- 食事フォーム ----
const place=()=>$('#pl').value==='他'?$('#pf').value.trim():$('#pl').value;
function autoCat(){if(catManual)return;const t=$('#t').value;$('#cat').value=t<'10:30'?'朝食':t<'15:00'?'昼食':t<'18:00'?'間食':'夕食'}
function resetForm(){$('#d').value=viewDate;$('#t').value=nowT();$('#pl').value='自宅';$('#pfw').hidden=true;$('#pf').value='';catManual=false;autoCat();clearDish()}
function clearDish(){['nm','kc','pp','ff','cc'].forEach(i=>$('#'+i).value='');$('#fc').value=1;pv()}
function pv(){const f=+$('#fc').value||1,k=$('#kc').value,p=$('#pp').value;
  $('#pv').textContent=f!==1&&(k||p)?'補正後 '+(k?r1(k*f)+'kcal ':'')+(p?'P'+r1(p*f)+'g':''):''}
['kc','pp','ff','cc','fc'].forEach(i=>$('#'+i).oninput=pv);
$('#t').oninput=autoCat;$('#cat').onchange=()=>catManual=true;
$('#pl').onchange=()=>{$('#pfw').hidden=$('#pl').value!=='他';showSg()};
$('#pf').oninput=showSg;

// 候補: 自宅/職場/実家は料理名のみ、それ以外は場所+料理名で一致。日付が新しいものを採用
function cands(q){
  const p=place(),home=HOME.includes(p),seen=new Set(),out=[];
  for(const m of meals){
    if(m.kcal==null&&m.p==null&&m.f==null&&m.c==null)continue;
    if(home?!HOME.includes(m.place):m.place!==p)continue;
    if(q&&!m.name.includes(q)||seen.has(m.name))continue;
    seen.add(m.name);out.push(m);if(out.length>=8)break;
  }return out}
function showSg(){
  const l=cands($('#nm').value.trim()),b=$('#sg');
  b.hidden=!l.length;
  b.innerHTML='<div class="l" style="position:static;border:0;box-shadow:none">'+l.map((m,i)=>
    `<div data-i="${i}">${esc(m.name)}<small>${m.kcal!=null?r1(m.kcal)+'kcal':''}${m.p!=null?' P'+m.p:''}</small></div>`).join('')+'</div>';
  b.onmousedown=e=>{const i=e.target.closest('[data-i]')?.dataset.i;if(i!=null){e.preventDefault();fill(l[i]);b.hidden=true}};
}
function fill(m){$('#nm').value=m.name;$('#kc').value=m.kcal??'';$('#pp').value=m.p??'';$('#ff').value=m.f??'';$('#cc').value=m.c??'';$('#fc').value=1;pv()}
$('#nm').oninput=showSg;$('#nm').onfocus=showSg;$('#nm').onblur=()=>{
  $('#sg').hidden=true;
  const ex=cands($('#nm').value.trim()).find(m=>m.name===$('#nm').value.trim());
  if(ex&&!editId&&!['kc','pp','ff','cc'].some(i=>$('#'+i).value))fill(ex)};

$('#mf').onsubmit=async e=>{e.preventDefault();
  const n=i=>$('#'+i).value===''?null:+$('#'+i).value;
  const row={eaten_date:$('#d').value,eaten_time:$('#t').value,place:place(),category:$('#cat').value,name:$('#nm').value.trim(),
    kcal:n('kc'),p:n('pp'),f:n('ff'),c:n('cc'),factor:n('fc')||1};
  if(!row.place)return alert('場所を入力してください');
  const{error}=await(editId?sb.from('meals').update(row).eq('id',editId):sb.from('meals').insert(row));
  if(error)return alert('保存できませんでした: '+error.message);
  viewDate=row.eaten_date;stopEdit();await load();
};
function stopEdit(){editId=null;$('#ft').textContent='食事を記録';$('#sv').textContent='記録する';$('#cn').hidden=true;clearDish()}
$('#cn').onclick=stopEdit;

// ---- 一覧・日合計 ----
const K=[['kcal','カロリー','kcal'],['p','たんぱく質','g'],['f','脂質','g'],['c','炭水化物','g']];
function renderDay(){
  if(!editId&&!$('#nm').value){$('#d').value=viewDate}
  $('#vd').value=viewDate;
  const list=meals.filter(m=>m.eaten_date===viewDate).sort((a,b)=>a.eaten_time<b.eaten_time?-1:1);
  if(!list.length){$('#tot').innerHTML='<span class="mut">この日の記録はありません</span>';$('#ls').innerHTML='';return}
  $('#tot').innerHTML=K.map(([k,l,u])=>{
    let s=0,x=0;list.forEach(m=>m[k]==null?x++:s+=m[k]*m.factor);
    return `<span><b>${l}</b> ${r1(s)}${u}${x?`<small> （${x}品未入力）</small>`:''}</span>`}).join('');
  $('#ls').innerHTML=list.map(m=>{
    const v=K.map(([k,l,u])=>`${l.slice(0,k==='kcal'?4:3)} ${m[k]==null?'－':r1(m[k]*m.factor)}`).join(' / ');
    return `<div class="it"><div class="mut">${m.eaten_time} ${m.category} ・ ${esc(m.place)}</div>
    <div><b>${esc(m.name)}</b>${m.factor!=1?' ×'+m.factor:''}</div><div class="mut">${v}</div>
    <button class="g" data-e="${m.id}">編集</button><button class="g" data-x="${m.id}" style="color:#c00">削除</button></div>`}).join('');
}
$('#ls').onclick=async e=>{
  const ei=e.target.dataset.e,xi=e.target.dataset.x;
  if(ei){const m=meals.find(x=>x.id==ei);editId=m.id;
    $('#d').value=m.eaten_date;$('#t').value=m.eaten_time;catManual=true;$('#cat').value=m.category;
    if(HOME.includes(m.place)){$('#pl').value=m.place;$('#pfw').hidden=true}else{$('#pl').value='他';$('#pfw').hidden=false;$('#pf').value=m.place}
    fill(m);$('#kc').value=m.kcal??'';$('#fc').value=m.factor;pv();
    $('#ft').textContent='記録を編集';$('#sv').textContent='更新する';$('#cn').hidden=false;scrollTo({top:0,behavior:'smooth'})}
  if(xi&&confirm('この記録を削除しますか？')){await sb.from('meals').delete().eq('id',xi);await load()}
};
const shift=n=>{const d=new Date(viewDate);d.setDate(d.getDate()+n);viewDate=d.toISOString().slice(0,10);renderDay()};
$('#pd').onclick=()=>shift(-1);$('#nd').onclick=()=>shift(1);
$('#vd').onchange=e=>{viewDate=e.target.value||today();renderDay()};

// ---- 体重 ----
$('#wf').onsubmit=async e=>{e.preventDefault();
  const{error}=await sb.from('weights').upsert({date:$('#wd').value,kg:+$('#wk').value},{onConflict:'user_id,date'});
  if(error)return alert('保存できませんでした: '+error.message);
  $('#wk').value='';await load()};
$('#rg').onclick=e=>{const r=e.target.dataset.r;if(r==null)return;range=+r;
  document.querySelectorAll('#rg button').forEach(b=>b.classList.toggle('on',b===e.target));renderChart()};
function renderChart(){
  if(!weights.length&&!chart)return;
  const t=x=>Date.parse(x),from=range?t(today())-range*864e5:0;
  const ma=weights.map(w=>{const a=weights.filter(x=>t(x.date)<=t(w.date)&&t(x.date)>t(w.date)-7*864e5);return r1(a.reduce((s,x)=>s+x.kg,0)/a.length)});
  const idx=weights.map((_,i)=>i).filter(i=>t(weights[i].date)>=from);
  const labels=idx.map(i=>weights[i].date.slice(5).replace('-','/'));
  const ds=[
    {label:'体重',data:idx.map(i=>weights[i].kg),borderColor:'#2563eb',backgroundColor:'#2563eb',tension:.2,pointRadius:3},
    {label:'7日平均',data:idx.map(i=>ma[i]),borderColor:'#9ca3af',borderDash:[5,4],pointRadius:0,tension:.3}];
  if(target!=null)ds.push({label:'目標',data:idx.map(()=>target),borderColor:'#ef4444',borderDash:[2,3],pointRadius:0});
  chart?.destroy();
  chart=new Chart($('#ch'),{type:'line',data:{labels,datasets:ds},options:{responsive:true,maintainAspectRatio:false,
    plugins:{legend:{position:'bottom'}},scales:{x:{grid:{display:false},ticks:{maxTicksLimit:7}},y:{grid:{color:'#f0f0f0'}}}}});
}

// ---- 設定・出力 ----
$('#tgs').onclick=async()=>{const v=$('#tg').value===''?null:+$('#tg').value;
  const{error}=await sb.from('settings').upsert({user_id:uid,target_kg:v});
  if(error)return alert('保存できませんでした: '+error.message);target=v;renderChart();alert('保存しました')};
$('#ex').onclick=()=>{
  const mo=$('#mo').value;if(!mo)return alert('月を選択してください');
  const ms=meals.filter(m=>m.eaten_date.startsWith(mo)),ws=weights.filter(w=>w.date.startsWith(mo));
  const days=[...new Set([...ms.map(m=>m.eaten_date),...ws.map(w=>w.date)])].sort();
  if(!days.length)return alert('この月の記録はありません');
  let o='';
  for(const d of days){
    const w=ws.find(x=>x.date===d);
    o+=`# ${d.replaceAll('-','/')}${w?'　体重 '+w.kg+'kg':''}\n`;
    const g={};ms.filter(m=>m.eaten_date===d).sort((a,b)=>a.eaten_time<b.eaten_time?-1:1)
      .forEach(m=>(g[m.eaten_time+'|'+m.category+'|'+m.place]??=[]).push(m));
    for(const k in g){const[tm,c,p]=k.split('|');o+=`- ${tm} ${c}\n    - ${p}\n`;
      g[k].forEach(m=>{o+=`        - ${m.name}\n`;
        [['kcal','カ'],['p','タ'],['f','脂'],['c','炭']].forEach(([x,l])=>{if(m[x]!=null)o+=`            - 〔${l}〕${r1(m[x]*m.factor)}\n`})})}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([o],{type:'text/markdown'}));
  a.download=`_食事記録_${mo.replace('-','')}.md`;a.click();
};

$('#wd').value=today();resetForm();
</script>
</body>
</html>
